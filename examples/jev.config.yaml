version: 1

# First matching rule wins. A safe default prevents newly-added tools from
# silently bypassing policy.
default: deny

audit:
  path: ../.jev/audit.jsonl
  includeArguments: true
  redact:
    - arguments.customer.email

approvals:
  path: ../.jev/approvals.jsonl

rules:
  - id: deny-destructive-shell
    description: Block destructive or privileged shell commands.
    action: deny
    reason: Destructive shell commands are never allowed.
    match:
      tools: ["shell", "shell.exec", "execute_command"]
      arguments:
        command:
          matches: '(^|[;&|]\s*)(rm\s+-[^\n]*r|sudo\b|mkfs\b|dd\s+if=)'

  - id: review-all-shell
    description: Require a human decision for other shell commands.
    action: require_approval
    match:
      tools: ["shell", "shell.exec", "execute_command"]

  - id: allow-read-tools
    description: Read-only filesystem operations.
    action: allow
    match:
      tools:
        - read_file
        - read_text_file
        - read_media_file
        - read_multiple_files
        - list_directory
        - list_directory_with_sizes
        - search_files
        - directory_tree
        - get_file_info
        - list_allowed_directories
        - "filesystem.read*"

  - id: review-write-tools
    description: Any filesystem mutation needs approval.
    action: require_approval
    match:
      tools:
        - write_file
        - edit_file
        - create_directory
        - move_file
        - delete_file
        - "filesystem.write*"
